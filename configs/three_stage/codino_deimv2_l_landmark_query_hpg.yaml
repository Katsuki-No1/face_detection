extends: codino_deimv2_l_landmark_query_baseline.yaml

schema_version: 1
experiment_name: codino_deimv2_l_landmark_query_strict_sequential_shared_vits16plus_hpg_seed42

model:
  head_pose_geometry:
    enabled: true
    inject_pose_queries: true
    query_injection_temperature: 0.20
    use_valid_pixel_and_border_inputs: true
    augmentation_consistency_enabled: true
    pose_encoder:
      checkpoint: checkpoint/head_pose_geometry/sixdrepnet360_1x3x224x224_full.onnx
      training_mode: frozen
      embedding_dimension: 128
      allow_full_finetune: false
    crop:
      output_size: 224
      context_scale: 1.35
      pad_value: 0.0
      augmentation:
        center_translation: 0.08
        log_scale_error: 0.12
        asymmetric_context: 0.12
        log_aspect_error: 0.08
        boundary_truncation_probability: 0.20
        boundary_truncation_fraction: [0.05, 0.35]
    geometry:
      enabled: true
      hidden_dimension: 128
      contour_points: 48
      shape_dimension: 0
      shape_limit: 0.15
      minimum_scale: 0.0001
      maximum_scale: 1.5
      visibility_sharpness: 10.0
    fusion:
      enabled: true
      hidden_dimension: 128
    loss_weights:
      rotation: 1.0
      projected_keypoints: 5.0
      amodal_ellipse_center: 2.0
      amodal_ellipse_axes: 2.0
      amodal_ellipse_angle: 1.0
      head_relative: 1.0
      observability: 1.0
      visibility: 0.5
      scale_prior: 0.05
      shape_prior: 0.01
      uncertainty: 0.05
      template_3d: 1.0
      scale_translation: 1.0
      augmentation_consistency: 0.5

train:
  seed: 42
  # The extra 24M-parameter HPG branch leaves less than 0.5 GiB headroom at
  # the inherited microbatch of 8. A one-step sizing probe can pass, while a
  # long epoch fragments the allocator and destabilizes the following CUDA
  # validation kernels. Preserve the effective batch of 16 with accumulation.
  batch_size: 4
  gradient_accumulation_steps: 4
  # HPG adds large pose/geometry gradients.  With four-way accumulation, an
  # initial scale of 16 still overflows FP16 during repeated real-data
  # backward passes; start conservatively and let GradScaler grow it after
  # sustained finite updates.
  grad_scaler_init_scale: 1.0
  batch_size_fallback:
    enabled: true
    candidates:
      - batch_size: 4
        gradient_accumulation_steps: 4
      - batch_size: 2
        gradient_accumulation_steps: 8
      - batch_size: 1
        gradient_accumulation_steps: 16
  learning_rates:
    head_pose_geometry: 1.0e-4
    external_head_cascade: 5.0e-4

evaluation:
  # Training uses teacher-forced GT Heads, while validation consumes as many
  # as 100 predicted Heads per image.  HPG expands every Head to a 224x224
  # crop, so inheriting batch 8 can fan out to 800 crops and exhaust the CUDA
  # kernel's safe memory headroom.  Keep the training microbatch unchanged and
  # bound only validation/inference fan-out.
  batch_size: 1

output:
  root: outputs/experiments/three_stage/codino_deimv2_l_landmark_query_hpg_seed42

wandb:
  name: codino_deimv2_l_landmark_query_strict_sequential_shared_vits16plus_hpg_seed42
