extends: codino_deimv2_l_landmark_query_baseline.yaml

schema_version: 1
experiment_name: codino_deimv2_l_landmark_query_keypoint_stage_seed42

experiment_objective:
  type: cascade_comparison
  claim_scope: cascade_selection_only
  joint_fine_tuning: false
  final_performance_claim: false

# Stage 2b: load the completed FACE-stage checkpoint, freeze every upstream
# HEAD/FACE component, and train FACE -> keypoint plus causal refinement.
train:
  stage:
    name: keypoint
    trainable_groups:
      - keypoint_decoder
      - association
      - cooperative_decoder
    loss_weights:
      loss_keypoint_independent: 10.0
      loss_association: 2.0
      loss_keypoint_refined: 10.0
      loss_visibility: 1.0

output:
  root: outputs/experiments/three_stage/codino_deimv2_l_keypoint_stage_seed42

wandb:
  group: three_stage_causal_curriculum
  name: codino_deimv2_l_keypoint_stage_seed42
  tags:
    - strict-sequential
    - causal-stage-2-keypoint
    - frozen-DINO-Co-DINO-FACE
    - objective-cascade-comparison
