extends: ../face_keypoint_cooperative/face_keypoint_cooperative_detr_l_960.yaml

schema_version: 1
experiment_name: codino_deimv2_l_landmark_query_strict_sequential_shared_vits16plus_baseline_seed42

# This joint configuration belongs to the later final-performance phase.  It
# is disabled in the cascade-selection queue until a cascade has been chosen.
experiment_objective:
  type: final_performance
  claim_scope: selected_cascade_end_to_end_performance
  joint_fine_tuning: true
  final_performance_claim: true

model:
  # One full-frame DINOv3 ViT-S+/16 pass is shared.  The raw stride-16
  # semantic map feeds Co-DINO HEAD.  HEAD ROIs condition DEIMv2-L FACE;
  # FACE ROIs then condition Landmark Query.  No ROI invokes DINO again.
  face_detector:
    initialization: pretrained
    config: configs/dinov3_deimv2/dinov3_deimv2_l_vits16plus_face_pose_drive_v2_balanced_811_960_ellipse.yaml
  shared_head_branch:
    enabled: true
    in_channels: 384
    category_id: 1
    score_threshold: 0.001
    # Preserve the baseline report's COCO maxDets=[1,10,100] contract.
    max_detections: 100
    loss_weight: 1.0
    # Train router/optional crop modules with ground-truth HEADs while the
    # internal detector itself is optimized by its own Co-DINO loss.  Eval and
    # test always consume detector predictions.
    teacher_force_targets: true
  # The containment router now consumes the internal shared-backbone HEAD
  # predictions; it no longer represents a second external DINO detector.
  external_head_cascade:
    enabled: true
    hidden_dimension: 64
    face_to_head_threshold: 0.50
    loss_weight: 2.0
    hard_negative_ratio: 10
  strict_sequential_cascade:
    enabled: true
    # These source declarations are validated by both the schema and GPU
    # architecture gates.  Training is robustified with GT ROI jitter; val
    # and test are deployment-style and consume only preceding predictions.
    training_head_source: ground_truth
    training_face_source: ground_truth
    evaluation_head_source: predicted
    evaluation_face_source: predicted
    enforce_unidirectional_refinement: true
    face_score_threshold: 0.80
    maximum_face_rois: 100
    head_to_face:
      context_scale: 1.25
      square: true
      center_jitter: 0.08
      log_scale_jitter: 0.12
    face_to_keypoint:
      context_scale: 1.25
      square: true
      center_jitter: 0.08
      log_scale_jitter: 0.12
  # A/B invariant: only the introduced arm enables this extension.
  head_pose_geometry:
    enabled: false

data:
  dataset_version: face_pose_drive_v2_balanced_811
  head_centric: true
  image_root: outputs/dataset_cache/face_pose_drive_v2_balanced_811
  image_size: 960
  category_ids: [1]
  target_category_id: 2
  annotations:
    train: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/train.json
    val: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/val.json
    test: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/test.json
  synthetic:
    enabled: false

train:
  seed: 42
  learning_rates:
    shared_head_branch: 1.0e-4
    external_head_cascade: 5.0e-4

output:
  root: outputs/experiments/three_stage/codino_deimv2_l_landmark_query_baseline_seed42

wandb:
  group: three_stage_strict_sequential_shared_vits16plus
  name: codino_deimv2_l_landmark_query_strict_sequential_shared_vits16plus_baseline_seed42
  tags:
    - strict-sequential
    - DINOv3-ViT-S-plus
    - shared-backbone
    - Co-DINO-HEAD
    - DEIMv2-L-FACE
    - landmark-query

verification:
  expected_full_image_dino_modules: 1
  expected_shared_dino_parameters: 28697472
  expected_shared_head_branch_parameters: 7814676
  expected_execution_order: [head, face, keypoint]
  expected_pose_to_face_refinement: false

provenance:
  seed: 42
  coordinate_conventions:
    detector_boxes: xyxy_pixels_on_960_square
    dino_patch_stride: 16
    normalized_face_pose_boxes: cxcywh_in_0_1
  annotation_sha256:
    train: b8a81c114c26a9476907ecb4611ee450e49a5f21a5683021841c8ddcb4a32ecb
    val: 0e4752e121606fd0ae1c60a090c845d64e058abc87ea540bc22fb142574bd0d0
    test: bd32bd1591686947bfcc79cbbcd79e1059bba1569e8bd06127d3327f2b776487
  checkpoint_sha256:
    dinov3_vits16plus: 4057cbaaad8c16657adb09d6815f28d4164eeba30532fde23f0d17313124caea
    deimv2_l_coco: c0d0f45fa62b785126db5b40f5530866fecaab2d340cea812d2ba5f0f5646163
  threshold_policy:
    source: validation_only
    test_selection_forbidden: true
    head_score_floor_for_curve: 0.001
