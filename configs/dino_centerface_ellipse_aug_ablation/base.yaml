experiment:
  family: dino_centerface_ellipse_aug_ablation
  name: base
  description: Fixed DINO + CenterFace/FCOS-style ellipse head settings for augmentation ablation.

model:
  type: dino_centerface_ellipse
  backbone:
    name: dinov3_vitb16
    patch_size: 16
    embed_dim: 768
    hub_repo: /home/katsuki/.cache/torch/hub/facebookresearch_dinov3_main
    hub_model: dinov3_vitb16
    hub_module: dinov3.hub.backbones
    weights: /home/katsuki/projects/face_detection/script/script_model/DINO/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    pretrained: false
    freeze: true
    unfreeze_last_n_blocks: 0
    strict_weights: true
    num_prefix_tokens: 0
    token_key: x_norm_patchtokens
    call_method: forward_features
    allow_non_divisible: false
  adapter:
    type: simple_fpn
    out_channels: 256
    norm: gn
    activation: silu
  neck:
    out_channels: 256
    num_levels: 3
    norm: gn
    activation: silu
  head:
    num_keypoints: 5
    predict_bbox: true
    predict_theta: true
    head_channels: 256
    num_convs: 2

loss:
  center: 1.0
  ellipse: 5.0
  keypoint: 1.0
  bbox: 0.5
  focal_alpha: 2.0
  focal_beta: 4.0

inference:
  score_threshold: 0.3
  topk: 100
  nms_threshold: 0.5
  detections_per_image: 100
  bbox_source: ellipse

data:
  format: yolo
  data_root: outputs_experiment/latest_yolo_pose_dataset_refresh/datasets/modified_100
  annotation_path: null
  image_root: null
  metadata_path: outputs_experiment/latest_yolo_pose_dataset_refresh/datasets/_modified_all_train/metadata/conversion_metadata.json
  split: train
  image_size: 896
  include_negative: true
  synthetic_if_missing: false

train:
  imgsz: 896
  batch_size: 4
  lr_head: 1.0e-4
  lr_backbone: 0.0
  epochs: 100
  seed: 42
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 3
  weight_decay: 0.05
  max_grad_norm: 10.0
  amp: true
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  fused_optimizer: true
  torch_compile:
    enabled: false
    mode: reduce-overhead
    fullgraph: false
    dynamic: false
  feature_cache:
    enabled: false
    dtype: float16
    reuse_existing: true
  progressive_resizing:
    enabled: false
    start_size: 672
    end_size: 896
    warmup_epochs: 20
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  device: cuda
  output_root: runs/dino_centerface_ellipse_aug_ablation

evaluation:
  split: test
  imgsz: 896
  prediction_conf_min: 0.001
  iou_threshold: 0.5
  thresholds: 0.01:0.95:0.01
  yolo11s_baseline_summary: outputs_experiment/dino_scrfd_vs_yolo11s_20260628/comparison_summary.json

augmentation:
  enabled: true
  mosaic: 0.0
  close_mosaic: 0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  fliplr: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  brightness: 0.0
  contrast: 0.0
  gamma: 0.0
  blur: 0.0
  noise: 0.0
  min_ellipse_radius: 2.0
