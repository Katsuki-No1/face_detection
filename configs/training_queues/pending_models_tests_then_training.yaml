      - "{project_root}/configs/three_stage/codino_deimv2_l_keypoint_stage.yaml"
      - --checkpoint
      - "{project_root}/outputs/training_gates/three_stage_face_stage/small_scale/checkpoints/best_val_loss.pt"
      - --device
      - cuda:0
      - --output
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/gpu_step/audit.json"
    completion_marker: outputs/training_gates/three_stage_keypoint_stage/gpu_step/audit_success.json

  - name: three_stage_keypoint_stage_overfit_gate
    enabled: true
    phase: gate
    architecture: three_stage_keypoint_stage
    gate_stage: overfit
    depends_on: [three_stage_keypoint_stage_gpu_step_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/train_face_keypoint_cooperative.py"
      - --config
      - "{project_root}/configs/three_stage/codino_deimv2_l_keypoint_stage.yaml"
      - --device
      - cuda:0
      - --output-dir
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/overfit"
      - --overfit-smoke
      - --max-samples
      - "4"
      - --overfit-steps
      - "64"
      - --no-resume
      - --no-wandb
      - --initialize-from
      - "{project_root}/outputs/training_gates/three_stage_face_stage/small_scale/checkpoints/best_val_loss.pt"
    completion_marker: outputs/training_gates/three_stage_keypoint_stage/overfit/overfit_success.json

  - name: three_stage_keypoint_stage_small_scale_gate
    enabled: true
    phase: gate
    architecture: three_stage_keypoint_stage
    gate_stage: small_scale
    depends_on: [three_stage_keypoint_stage_overfit_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_small_scale_training_gate.py"
      - --work-dir
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/small_scale"
      - --metrics
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/small_scale/metrics.csv"
      - --metric
      - val/loss_total
      - --direction
      - lower
      - --minimum-points
      - "5"
      - --minimum-relative-improvement
      - "0.005"
      - --success-marker
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/small_scale/success.json"
      - --report
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/small_scale/report.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/train_face_keypoint_cooperative.py"
      - --config
      - "{project_root}/configs/three_stage/codino_deimv2_l_keypoint_stage.yaml"
      - --device
      - cuda:0
      - --output-dir
      - "{project_root}/outputs/training_gates/three_stage_keypoint_stage/small_scale"
      - --epochs
      - "5"
      - --max-samples
      - "128"
      - --no-resume
      - --no-wandb
      - --initialize-from
      - "{project_root}/outputs/training_gates/three_stage_face_stage/small_scale/checkpoints/best_val_loss.pt"
    completion_marker: outputs/training_gates/three_stage_keypoint_stage/small_scale/success.json

  # -----------------------------------------------------------------------
  # TEST GROUP: historical frozen-DINO shared component
  # -----------------------------------------------------------------------
  - name: shared_head_codino_schema_gate
    enabled: true
    phase: gate
