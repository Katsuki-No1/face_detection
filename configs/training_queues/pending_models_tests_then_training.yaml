      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960.yaml"
      - --success-marker
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960/schema/success.json"
    completion_marker: outputs/training_gates/shared_head_codino_vits16plus_960/schema/success.json

  - name: shared_head_codino_gpu_step_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960
    gate_stage: gpu_step
    depends_on: [shared_head_codino_schema_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_training_command_gate.py"
      - --stage
      - gpu_step
      - --success-marker
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960/gpu_step/success.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/audit_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960.yaml"
      - --output
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960/gpu_step/audit.json"
