  - name: shared_head_codino_overfit_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960
    gate_stage: overfit
    depends_on: [shared_head_codino_gpu_step_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/train_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960.yaml"
      - --output-dir
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960/overfit"
      - --overfit-images
      - "4"
      - --epochs
      - "20"
      - --max-steps
      - "64"
      - --no-wandb
    completion_marker: outputs/training_gates/shared_head_codino_vits16plus_960/overfit/overfit_success.json

  - name: shared_head_codino_small_scale_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960
    gate_stage: small_scale
    depends_on: [shared_head_codino_overfit_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_small_scale_training_gate.py"
      - --work-dir
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960/small_scale"
      - --metrics
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960/small_scale/metrics.csv"
      - --metric
      - val/loss_total
      - --direction
