version: 1

queue:
  name: pending_models_tests_then_training
  state_dir: outputs/training_queues/pending_models_tests_then_training
  continue_on_failure: false
  # Preserve fail-fast behavior for gates and production training.  An
  # evaluation/postprocess failure is recorded, its dependents are skipped,
  # and independent later inference jobs are still attempted.
  continue_on_failure_phases: [evaluation, postprocess]
  gate_contract:
    enabled: true
    tests_first: true
    required_stages: [schema, gpu_step, overfit, small_scale]
  gpu:
    index: 0
  wait:
    poll_seconds: 15
    log_interval_seconds: 60
    idle_samples: 4
    # WSL includes the Windows display/compositor load in this reading even
    # when no CUDA process exists. Process detection plus the low-memory
    # ceiling remain the primary guards against training overlap.
    max_gpu_utilization: 25
    max_memory_used_mib: 2500
    timeout_seconds: 0
    extra_process_patterns: []

# Execution contract:
#   1. Every gate for every pending architecture runs first.
#   2. No production training starts unless all four gates for its architecture
#      have explicit success markers.
#   3. All production training jobs are contiguous. Evaluation follows them,
#      so an unattended machine spends the long window training continuously.
jobs:
  # -----------------------------------------------------------------------
  # TEST GROUP: KeypointComparison2 DEIMv2 Joint
  # -----------------------------------------------------------------------
  - name: deimv2_joint_schema_gate
    enabled: true
    phase: gate
    architecture: keypoint_comparison2_deimv2_joint
    gate_stage: schema
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_training_schema_gate.py"
      - --kind
      - keypoint_comparison2
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --success-marker
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/schema/success.json"
    completion_marker: outputs/training_gates/keypoint_comparison2_deimv2_joint/schema/success.json

  - name: deimv2_joint_gpu_step_gate
    enabled: true
    phase: gate
    architecture: keypoint_comparison2_deimv2_joint
    gate_stage: gpu_step
    depends_on: [deimv2_joint_schema_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_training_command_gate.py"
      - --stage
      - gpu_step
      - --success-marker
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/gpu_step/success.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - preflight
      - --models
      - deimv2_joint
      - --device
      - cuda:0
      - --forward-preflight
    completion_marker: outputs/training_gates/keypoint_comparison2_deimv2_joint/gpu_step/success.json

  - name: deimv2_joint_overfit_gate
    enabled: true
    phase: gate
    architecture: keypoint_comparison2_deimv2_joint
    gate_stage: overfit
    depends_on: [deimv2_joint_gpu_step_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_small_scale_training_gate.py"
      - --work-dir
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/overfit"
      - --metrics
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/overfit/deimv2_joint/metrics.csv"
      - --metric
      - loss_total
      - --direction
      - lower
      - --minimum-points
      - "8"
      - --minimum-relative-improvement
      - "0.05"
      - --success-marker
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/overfit/success.json"
      - --report
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/overfit/report.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - train
      - --models
      - deimv2_joint
      - --device
      - cuda:0
      - --output-root
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/overfit"
      - --epochs
      - "12"
      - --freeze-backbone-epochs
      - "12"
      - --max-train-samples
      - "4"
      - --max-val-samples
      - "4"
      - --no-resume
      - --no-wandb
    completion_marker: outputs/training_gates/keypoint_comparison2_deimv2_joint/overfit/success.json

  - name: deimv2_joint_small_scale_gate
    enabled: true
    phase: gate
    architecture: keypoint_comparison2_deimv2_joint
    gate_stage: small_scale
    depends_on: [deimv2_joint_overfit_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_small_scale_training_gate.py"
      - --work-dir
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/small_scale"
      - --metrics
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/small_scale/deimv2_joint/metrics.csv"
      - --metric
      - validation_loss
      - --direction
      - lower
      - --minimum-points
      - "5"
      - --minimum-relative-improvement
      - "0.003"
      - --minimum-improving-transition-fraction
      - "0.4"
      - --success-marker
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/small_scale/success.json"
      - --report
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/small_scale/report.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - train
      - --models
      - deimv2_joint
      - --device
      - cuda:0
      - --output-root
      - "{project_root}/outputs/training_gates/keypoint_comparison2_deimv2_joint/small_scale"
      - --epochs
      - "12"
      - --max-train-samples
      - "128"
      - --max-val-samples
      - "128"
      - --no-resume
      - --no-wandb
    completion_marker: outputs/training_gates/keypoint_comparison2_deimv2_joint/small_scale/success.json

  # -----------------------------------------------------------------------
  # TEST GROUP: causal curriculum stage 1, unfrozen DINOv3 + Co-DINO HEAD
  # -----------------------------------------------------------------------
  - name: shared_head_codino_unfrozen_schema_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960_unfrozen
    gate_stage: schema
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_training_schema_gate.py"
      - --kind
      - head_codino
      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960_unfrozen.yaml"
      - --success-marker
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/schema/success.json"
    completion_marker: outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/schema/success.json

  - name: shared_head_codino_unfrozen_gpu_step_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960_unfrozen
    gate_stage: gpu_step
    depends_on: [shared_head_codino_unfrozen_schema_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_training_command_gate.py"
      - --stage
      - gpu_step
      - --success-marker
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/gpu_step/success.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/audit_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960_unfrozen.yaml"
      - --checkpoint
      - "{project_root}/runs/shared_head_codino_vits16plus_960_balanced_811/last.pth"
      - --output
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/gpu_step/audit.json"
    completion_marker: outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/gpu_step/success.json

  - name: shared_head_codino_unfrozen_overfit_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960_unfrozen
    gate_stage: overfit
    depends_on: [shared_head_codino_unfrozen_gpu_step_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/train_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960_unfrozen.yaml"
      - --initialize-head-from
      - "{project_root}/runs/shared_head_codino_vits16plus_960_balanced_811/last.pth"
      - --output-dir
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/overfit"
      - --overfit-images
      - "4"
      - --epochs
      - "20"
      - --max-steps
      - "64"
      - --no-wandb
    completion_marker: outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/overfit/overfit_success.json

  - name: shared_head_codino_unfrozen_small_scale_gate
    enabled: true
    phase: gate
    architecture: shared_head_codino_vits16plus_960_unfrozen
    gate_stage: small_scale
    depends_on: [shared_head_codino_unfrozen_overfit_gate]
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/run_small_scale_training_gate.py"
      - --work-dir
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/small_scale"
      - --metrics
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/small_scale/metrics.csv"
      - --metric
      - val/loss_total
      - --direction
      - lower
      - --minimum-points
      - "5"
      - --minimum-relative-improvement
      # This stage warm-starts a converged HEAD detector. Require a measurable
      # validation gain while accounting for the smaller remaining headroom.
      - "0.003"
      - --success-marker
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/small_scale/success.json"
      - --report
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/small_scale/report.json"
      - --
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/train_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/shared_three_stage_960_unfrozen.yaml"
      - --initialize-head-from
      - "{project_root}/runs/shared_head_codino_vits16plus_960_balanced_811/last.pth"
      - --output-dir
      - "{project_root}/outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/small_scale"
      - --epochs
      - "5"
      - --max-train-samples
      - "128"
      - --max-val-samples
      - "128"
      - --no-wandb
    completion_marker: outputs/training_gates/shared_head_codino_vits16plus_960_unfrozen/small_scale/success.json

  # -----------------------------------------------------------------------
  # TEST GROUP: causal curriculum stage 2a, fixed HEAD -> FACE
  # -----------------------------------------------------------------------
  - name: three_stage_face_stage_schema_gate
    enabled: true
    phase: gate
    architecture: three_stage_face_stage
    gate_stage: schema
