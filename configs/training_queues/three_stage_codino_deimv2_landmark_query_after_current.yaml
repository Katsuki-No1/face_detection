      - --output
      - "{project_root}/outputs/three_stage/codino_deimv2_l_landmark_query/head_detections/train.json"
      - --split
      - train
      - --detector-name
      - head_codino_vits16plus_balanced_811_seed42
      - --checkpoint
      - "{project_root}/runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811/last.pth"
