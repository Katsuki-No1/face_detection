      - --output
      - "{project_root}/outputs/head_codino/face_pose_drive_v2_balanced_811/test_predictions.json"
    completion_marker: outputs/head_codino/face_pose_drive_v2_balanced_811/test_predictions_metrics.json

  - name: three_stage_build_train_head_cache
    enabled: false
