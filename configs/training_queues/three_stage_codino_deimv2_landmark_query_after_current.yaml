      - "{project_root}/scripts/eval_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/face_pose_drive_v2_balanced_811.yaml"
      - --checkpoint
      - "{project_root}/runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811/last.pth"
      - --split
      - train
      - --output
      - "{project_root}/outputs/head_codino/face_pose_drive_v2_balanced_811/train_predictions.json"
    completion_marker: outputs/head_codino/face_pose_drive_v2_balanced_811/train_predictions_metrics.json

