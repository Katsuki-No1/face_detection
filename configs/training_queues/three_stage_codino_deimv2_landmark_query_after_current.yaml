      - "{project_root}/scripts/select_head_codino_threshold.py"
      - --annotations
      - "{project_root}/outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/val.json"
      - --predictions
      - "{project_root}/outputs/head_codino/face_pose_drive_v2_balanced_811/val_predictions.json"
      - --output
      - "{project_root}/outputs/three_stage/codino_deimv2_l_landmark_query/head_detections/validation_threshold.json"
      - --minimum-precision
      - "0.90"
      - --iou-threshold
      - "0.50"
    completion_marker: outputs/three_stage/codino_deimv2_l_landmark_query/head_detections/validation_threshold.json

