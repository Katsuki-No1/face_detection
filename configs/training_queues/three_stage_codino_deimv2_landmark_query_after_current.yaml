version: 1

queue:
  name: three_stage_codino_deimv2_landmark_query_after_current
  state_dir: outputs/training_queues/three_stage_codino_deimv2_landmark_query_after_current
  continue_on_failure: false
  gpu:
    index: 0
  wait:
    poll_seconds: 15
    log_interval_seconds: 60
    idle_samples: 4
    max_gpu_utilization: 10
    max_memory_used_mib: 2500
    timeout_seconds: 0
    # The successor cooperative queue is itself waiting for the primary
    # queue. Blocking on it preserves the complete already-scheduled order,
    # including idle gaps between its jobs.
    extra_process_patterns:
      - "run_training_queue_when_idle\\.py.*face_keypoint_cooperative_after_current\\.yaml"

jobs:
  # Legacy standalone HEAD jobs are retained as an explicit provenance trail
  # but disabled.  The active three-stage arms train the internal Co-DINO HEAD
  # branch from the same ViT-S+/16 invocation used by FACE/Landmark Query.
  - name: head_codino_balanced_811_preflight
    enabled: false
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/audit_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/face_pose_drive_v2_balanced_811.yaml"
      - --output
      - "{project_root}/outputs/head_codino/face_pose_drive_v2_balanced_811/preflight.json"
    completion_marker: outputs/head_codino/face_pose_drive_v2_balanced_811/preflight.json

  - name: head_codino_balanced_811_real_data_overfit
    enabled: false
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/train_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/face_pose_drive_v2_balanced_811.yaml"
      - --output-dir
      - "{project_root}/runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811_overfit"
      - --overfit-images
      - "4"
      - --epochs
      - "20"
      - --max-steps
      - "64"
    completion_marker: runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811_overfit/overfit_success.json

  - name: head_codino_balanced_811_train
    enabled: false
    depends_on:
      - head_codino_balanced_811_preflight
      - head_codino_balanced_811_real_data_overfit
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/train_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/face_pose_drive_v2_balanced_811.yaml"
      - --output-dir
      - "{project_root}/runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811"
    completion_marker: runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811/training_complete.json
    resume:
      checkpoint: runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811/last.pth
      arguments:
        - --resume
        - "{checkpoint}"

  - name: head_codino_balanced_811_checkpoint_audit
    enabled: false
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/audit_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/face_pose_drive_v2_balanced_811.yaml"
      - --checkpoint
      - "{project_root}/runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811/last.pth"
      - --output
      - "{project_root}/outputs/head_codino/face_pose_drive_v2_balanced_811/checkpoint_audit.json"
    completion_marker: outputs/head_codino/face_pose_drive_v2_balanced_811/checkpoint_audit.json

  - name: head_codino_balanced_811_val_predictions
    enabled: false
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/scripts/eval_head_codino.py"
      - --config
      - "{project_root}/configs/head_codino/face_pose_drive_v2_balanced_811.yaml"
      - --checkpoint
      - "{project_root}/runs/head_codino_vits16plus_face_pose_drive_v2_balanced_811/last.pth"
      - --split
      - val
      - --output
      - "{project_root}/outputs/head_codino/face_pose_drive_v2_balanced_811/val_predictions.json"
    completion_marker: outputs/head_codino/face_pose_drive_v2_balanced_811/val_predictions_metrics.json

  - name: head_codino_balanced_811_select_val_threshold
