version: 1

queue:
  name: after_current_models
  state_dir: outputs/training_queues/after_current_models
  continue_on_failure: false
  gpu:
    index: 0
  wait:
    poll_seconds: 15
    log_interval_seconds: 60
    idle_samples: 4
    max_gpu_utilization: 10
    max_memory_used_mib: 2500
    timeout_seconds: 0
    extra_process_patterns: []

# Add future models as additional entries in this list. Jobs run in list order.
# command is an argument list and is never executed through a shell.
# If completion_marker exists, the job is skipped.
# If resume.checkpoint exists while completion_marker does not, resume.arguments
# are appended automatically.
jobs:
  - name: dinov3_deimv2_l_face_pose_drive_v2_balanced_811_ellipse_from_coco
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/tools/train_dinov3_deimv2.py"
      - --config
      - "{project_root}/configs/dinov3_deimv2/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco.yaml"
      - --data-root
      - "{project_root}/outputs/dataset_cache/face_pose_current"
      - --output-dir
      - "{project_root}/outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco"
      - --device
      - cuda:0
      - --wandb
      - --wandb-entity
      - sato-waseda-university
      - --wandb-project
      - face_detection
      - --wandb-run-name
      - dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_ellipse_from_coco_seed0
      - --wandb-group
      - face_pose_drive_v2_balanced_811_deimv2_ellipse_from_coco
      - --wandb-mode
      - online
      - --dataset-version
      - face_pose_drive_v2_balanced_811
    completion_marker: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/summary.md
    resume:
      checkpoint: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/checkpoints/last.pt
      arguments:
        - --resume-from
        - "{checkpoint}"

  - name: calibrate_ellipse_deim_crop_residuals
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/calibrate_ellipse_error.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --device
      - cuda:0
    completion_marker: outputs/crop_error_models/face_pose_drive_v2_balanced_811/ellipse_deim_val_residuals.json

  - name: keypoint_comparison2_extract_balanced_811_dinov3_backbone
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/prepare_weights.py"
      - --extract-dinov3-s-from-detector
      - --detector-checkpoint
      - "{project_root}/outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/checkpoints/best_val_ellipse_map.pt"
      - --destination
      - "{project_root}/checkpoint/DINOv3/dinov3_vits16_face_pose_drive_v2_balanced_811_deimv2_backbone.pth"
    completion_marker: checkpoint/DINOv3/dinov3_vits16_face_pose_drive_v2_balanced_811_deimv2_backbone.pth

  - name: keypoint_comparison2_preflight
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - preflight
      - --models
      - all
      - --device
      - cuda:0
    completion_marker: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/preflight.json

  - name: keypoint_comparison2_rtmpose_face5
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - train
      - --models
      - rtmpose_face5
      - --device
      - cuda:0
      - --resume
    completion_marker: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/rtmpose_face5/training_complete.json
    resume:
      checkpoint: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/rtmpose_face5/checkpoints/last.pt
      arguments: []

  - name: keypoint_comparison2_dinov3_fpn_rtmcc
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - train
      - --models
      - dinov3_fpn_rtmcc
      - --device
      - cuda:0
      - --resume
    completion_marker: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/dinov3_fpn_rtmcc/training_complete.json
    resume:
      checkpoint: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/dinov3_fpn_rtmcc/checkpoints/last.pt
      arguments: []

  - name: keypoint_comparison2_dinov3_orformer_rtmcc
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - train
      - --models
      - dinov3_orformer_rtmcc
      - --device
      - cuda:0
      - --resume
    completion_marker: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/dinov3_orformer_rtmcc/training_complete.json
    resume:
      checkpoint: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/dinov3_orformer_rtmcc/checkpoints/last.pt
      arguments: []

  - name: keypoint_comparison2_deimv2_joint
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison2/run.py"
      - --config
      - "{project_root}/keypoint_comparison2/configs/production.yaml"
      - --stage
      - train
      - --models
      - deimv2_joint
      - --device
      - cuda:0
      - --resume
    completion_marker: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/deimv2_joint/training_complete.json
    resume:
      checkpoint: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/deimv2_joint/checkpoints/last.pt
      arguments: []

  - name: keypoint_comparison1_vitpose_376
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison1/scripts/run_landmark_experiments.py"
      - --config
      - "{project_root}/keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml"
      - --stage
      - train
      - --variants
      - vitpose_376
      - --device
      - cuda:0
      - --resume
      - --wandb
    completion_marker: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/vitpose_376/training_summary.json
    resume:
      checkpoint: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/vitpose_376/checkpoints/last.pt
      arguments: []

  - name: keypoint_comparison1_landmark_query
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison1/scripts/run_landmark_experiments.py"
      - --config
      - "{project_root}/keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml"
      - --stage
      - train
      - --variants
      - query
      - --device
      - cuda:0
      - --resume
      - --wandb
    completion_marker: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/query/training_summary.json
    resume:
      checkpoint: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/query/checkpoints/last.pt
      arguments: []

  - name: keypoint_comparison1_vitpose_376_evaluate
    enabled: true
    command:
      - "{project_root}/.venv/bin/python"
      - "{project_root}/keypoint_comparison1/scripts/run_landmark_experiments.py"
      - --config
      - "{project_root}/keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml"
      - --stage
      - evaluate
      - --variants
      - query
      - vitpose_376
      - --evaluation-set
      - v2_test
      - --evaluation-set
      - external_v1_v2
      - --device
      - cuda:0
    completion_marker: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/evaluation/v2_test/G_vitpose_376_deim/metrics.json
