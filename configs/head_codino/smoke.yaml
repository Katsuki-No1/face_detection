model:
  type: head_codino
  dinov3_source_root: models/source/dinov3
  backbone_weights: null
  freeze_backbone: true
  unfreeze_last_n_blocks: 0
  category_id: 1
  score_threshold: 0.30
  max_detections: 100

architecture:
  backbone:
    name: dinov3_vits16plus
    patch_size: 16
    embed_dim: 384
    blocks: 12
    attention_heads: 6
    output: x_norm_patchtokens
  sfp:
    input_channels: 384
    output_channels: 256
    levels: [p3, p4, p5, p6]
    strides: [8, 16, 32, 64]
    detector_levels: [p3, p4, p5]
    conv_bias: false
  codino:
    hidden_dim: 256
    feature_levels: 3
    encoder_layers: 1
    decoder_layers: 3
    attention_heads: 8
    sampling_points: 4
    ffn_dim: 1024
    activation: ReLU
    matching_queries: 100
    two_stage: true
    mixed_selection: true
    iterative_box_refinement: true
    dn_query_budget: 50
    dn_label_noise: 0.5
    dn_box_noise: 0.4
    positional_encoding:
      num_feats: 128
      temperature: 20
      normalize: true
      dropout: 0.0
  matching_costs:
    focal: 2.0
    l1: 5.0
    giou: 2.0
  losses:
    quality_focal: 1.0
    l1: 5.0
    giou: 2.0

data:
  root: datasets/face_pose_drive_v2
  train:
    annotation: datasets/face_pose_drive_v2/annotations/rtmdet_hf/train.json
  val:
    annotation: datasets/face_pose_drive_v2/annotations/rtmdet_hf/val.json
  test:
    annotation: datasets/face_pose_drive_v2/annotations/rtmdet_hf/test.json

train:
  output_dir: runs/head_codino_smoke
  epochs: 1
  batch_size: 1
  num_workers: 0
  accumulation_steps: 1
  amp: true
  fused_adamw: true
  gradient_clip_norm: 0.1
  weight_decay: 0.0001
  backbone_lr: 0.00001
  sfp_lr: 0.0001
  head_lr: 0.0001
  milestones: []
  lr_gamma: 0.1
  ema_decay: 0.9998
  seed: 42
  save_every: 1

evaluation:
  batch_size: 1
  num_workers: 0
  split: val
  output: outputs/head_codino/smoke_val_predictions.json

benchmark:
  resolutions: [[128, 160]]
  batch_size: 1
  warmup: 2
  iterations: 5
  output: outputs/head_codino/smoke_benchmark.json
