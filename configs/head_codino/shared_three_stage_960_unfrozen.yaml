extends: shared_three_stage_960.yaml

experiment_objective:
  type: cascade_comparison
  claim_scope: upstream_component_for_cascade_selection
  joint_fine_tuning: false
  final_performance_claim: false

# Stage 1 of the causal curriculum.  The previous HEAD run trained only SFP
# and Co-DINO.  This run warm-starts those two components, unfreezes the exact
# shared DINOv3 ViT-S+/16, and adapts DINO + Co-DINO together on HEAD labels.
model:
  freeze_backbone: false
  unfreeze_last_n_blocks: 0

train:
  output_dir: runs/shared_head_codino_vits16plus_960_balanced_811_unfrozen
  epochs: 12
  backbone_lr: 1.0e-5
  sfp_lr: 1.0e-4
  head_lr: 1.0e-4
  validate_each_epoch: true
  save_every: 5

evaluation:
  output: outputs/shared_head_codino_vits16plus_960_balanced_811_unfrozen/val_predictions.json

benchmark:
  output: outputs/shared_head_codino_vits16plus_960_balanced_811_unfrozen/benchmark.json

wandb:
  group: shared_head_codino_vits16plus_960_unfrozen
  name: shared_head_codino_vits16plus_960_balanced_811_unfrozen_seed42
  tags:
    - DINOv3-ViT-S-plus
    - Co-DINO-HEAD
    - dino-unfrozen
    - causal-stage-1
    - objective-cascade-comparison
