experiment_name: debug_dinov3_deimv2_official

model:
  type: dinov3_deimv2
  num_classes: 2
  class_names: ["head", "face"]
  backbone:
    name: dinov3_vitb16
    patch_size: 16
    embed_dim: 64
    dummy: true
    pretrained: false
    freeze: true
    trainable_last_blocks: 0
    strict_weights: false
    num_prefix_tokens: 0
    token_key: x_norm_patchtokens
    call_method: auto
    allow_non_divisible: false
  adapter:
    type: official_dinov3_sta
    hidden_dim: 64
    interaction_indexes: [3, 7, 11]
    conv_inplane: 8
    use_sta: true
  encoder:
    type: official_hybrid_encoder
    in_channels: [64, 64, 64]
    feat_strides: [8, 16, 32]
    hidden_dim: 64
    nhead: 4
    dim_feedforward: 128
    use_encoder_idx: [2]
    num_encoder_layers: 1
    depth_mult: 0.34
    expansion: 0.5
    version: deim
    csp_type: csp2
    fuse_op: sum
  decoder:
    type: official_deim_transformer
    feat_channels: [64, 64, 64]
    feat_strides: [8, 16, 32]
    hidden_dim: 64
    num_queries: 12
    num_layers: 1
    nhead: 4
    dim_feedforward: 128
    num_denoising: 4
    label_noise_ratio: 0.5
    box_noise_scale: 1.0
    num_levels: 3
    num_points: [2, 2, 2]
    reg_max: 8
    reg_scale: 4.0
    eval_idx: -1
    aux_loss: true
    cross_attn_method: default
    query_select_method: default
    activation: silu
    mlp_act: silu

loss:
  use_focal_loss: true
  weight_dict: {loss_mal: 1.0, loss_bbox: 5.0, loss_giou: 2.0, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ["mal", "boxes", "local"]
  alpha: 0.75
  gamma: 1.5
  reg_max: 8
  matcher:
    weight_dict: {cost_class: 2.0, cost_bbox: 5.0, cost_giou: 2.0}
    alpha: 0.25
    gamma: 2.0
    change_matcher: true
    iou_order_alpha: 4.0
    matcher_change_epoch: 1

data:
  format: coco
  data_root: dataset
  annotation_path: dataset/annotations/instances_train.json
  image_root: dataset
  split: train
  image_size: 64
  include_negative: true
  category_ids: [1, 2]
  synthetic_if_missing: true

train:
  name: debug_dinov3_deimv2_official
  imgsz: 64
  batch_size: 2
  epochs: 1
  seed: 0
  lr: 1.0e-3
  lr_head: 1.0e-3
  lr_backbone: 0.0
  weight_decay: 0.0
  max_grad_norm: 10.0
  scheduler: none
  amp: false
  tf32: false
  cudnn_benchmark: false
  fused_optimizer: false
  torch_compile:
    enabled: false
  feature_cache:
    enabled: false
  progressive_resizing:
    enabled: false
  num_workers: 0
  device: cpu
  allow_cpu_training: true
  allow_dummy_backbone: true
  output_root: outputs/experiments

inference:
  score_thr: 0.01
  remap_mscoco_category: false
  topk: 12
  detections_per_image: 12

augmentation:
  enabled: false

output:
  root: outputs/experiments
  experiment_group: dinov3_deimv2
