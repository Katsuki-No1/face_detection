extends: dinov3_deimv2_m_face_pretrained.yaml

experiment_name: dinov3_deimv2_m_face_pretrained_960_aug

train:
  name: dinov3_deimv2_m_face_pretrained_960_aug
  imgsz: 960
  batch_size: 16
  epochs: 120
  validation:
    enabled: true
    every: 5
    split: val
    image_size: 960
    fixed_threshold: 0.30
    score_min: 0.001

data:
  image_size: 960

augmentation:
  enabled: true
  # Combined face-detector augmentation: geometry + photometric + blur(mid) + mosaic.
  mosaic: 0.3
  close_mosaic: 20
  mixup: 0.0
  mixup_alpha: 0.20
  degrees: 10.0
  translate: 0.08
  scale: 0.30
  shear: 2.0
  perspective: 0.0005
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.50
  hsv_v: 0.35
  brightness: 0.25
  contrast: 0.25
  gamma: 0.20
  blur: 0.20
  blur_radius_min: 0.3
  blur_radius_max: 1.5
  noise: 0.03
  min_ellipse_radius: 2.0
