model:
  # ViT-S and ViT-S+ are not tensor-compatible in every MLP block.  Preserve
  # the exact local S+ weights below, while warm-starting only the compatible
  # STA/HybridEncoder/DEIMv2-L tensors from the public COCO checkpoint.
  init_checkpoint:
    path: checkpoint/DEIMv2/deimv2_dinov3_l_coco.safetensors
    prefer_ema: false
    skip_class_heads: true
    skip_prefixes:
      - backbone.dinov3.
      - backbone.dino.backbone.
    verbose: true
  backbone:
    type: official_dinov3_vits16plus
    name: dinov3_vits16plus
    patch_size: 16
    embed_dim: 384
    hub_repo: models/source/dinov3
    hub_model: dinov3_vits16plus
    hub_module: dinov3.hub.backbones
    pretrained: false
    weights: Dino/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
    freeze: false
    trainable_last_blocks: 0
    strict_weights: true
    num_prefix_tokens: 0
    token_key: x_norm_patchtokens
    call_method: forward_features
    allow_non_divisible: false

train:
  name: dinov3_deimv2_l_vits16plus_face_pose_drive_v2_balanced_811_960_ellipse

