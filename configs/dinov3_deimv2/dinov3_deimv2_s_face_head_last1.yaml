experiment_name: dinov3_deimv2_official_vitb16_face_head_last1

model:
  type: dinov3_deimv2
  num_classes: 2
  class_names: ["head", "face"]
  backbone:
    name: dinov3_vitb16
    patch_size: 16
    embed_dim: 768
    hub_repo: /home/katsuki/.cache/torch/hub/facebookresearch_dinov3_main
    hub_model: dinov3_vitb16
    hub_module: dinov3.hub.backbones
    weights: /home/katsuki/projects/face_detection/script/script_model/DINO/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    pretrained: false
    freeze: true
    trainable_last_blocks: 1
    strict_weights: true
    num_prefix_tokens: 0
    token_key: x_norm_patchtokens
    call_method: forward_features
    allow_non_divisible: false
  adapter:
    type: official_dinov3_sta
    hidden_dim: 256
    interaction_indexes: [3, 7, 11]
    conv_inplane: 16
    use_sta: true
  encoder:
    type: official_hybrid_encoder
    in_channels: [256, 256, 256]
    feat_strides: [8, 16, 32]
    hidden_dim: 256
    nhead: 8
    dim_feedforward: 1024
    use_encoder_idx: [2]
    num_encoder_layers: 1
    depth_mult: 0.67
    expansion: 0.34
    version: deim
    csp_type: csp2
    fuse_op: sum
  decoder:
    type: official_deim_transformer
    feat_channels: [256, 256, 256]
    feat_strides: [8, 16, 32]
    hidden_dim: 256
    num_queries: 300
    num_layers: 4
    nhead: 8
    dim_feedforward: 1024
    num_denoising: 100
    label_noise_ratio: 0.5
    box_noise_scale: 1.0
    num_levels: 3
    num_points: [3, 6, 3]
    reg_max: 32
    reg_scale: 4.0
    eval_idx: -1
    aux_loss: true
    cross_attn_method: default
    query_select_method: default
    activation: silu
    mlp_act: silu

loss:
  use_focal_loss: true
  weight_dict: {loss_mal: 1.0, loss_bbox: 5.0, loss_giou: 2.0, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ["mal", "boxes", "local"]
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    weight_dict: {cost_class: 2.0, cost_bbox: 5.0, cost_giou: 2.0}
    alpha: 0.25
    gamma: 2.0
    change_matcher: true
    iou_order_alpha: 4.0
    matcher_change_epoch: 100

data:
  format: coco
  data_root: dataset
  annotation_path: dataset/annotations/instances_train.json
  image_root: dataset
  split: train
  image_size: 640
  include_negative: true
  category_ids: [1, 2]
  synthetic_if_missing: false

train:
  name: dinov3_deimv2_official_vitb16_face_head_last1
  imgsz: 640
  batch_size: 4
  epochs: 132
  seed: 0
  lr: 5.0e-4
  lr_head: 5.0e-4
  lr_backbone: 2.5e-5
  weight_decay: 0.0001
  max_grad_norm: 0.1
  scheduler: cosine
  warmup_epochs: 3
  amp: true
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  fused_optimizer: true
  param_groups:
    - name: dinov3_decay
      params: '^(?=.*backbone\.dino\.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 2.5e-5
    - name: dinov3_no_decay
      params: '^(?=.*backbone\.dino\.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 2.5e-5
      weight_decay: 0.0
    - name: deim_no_decay
      params: '^(?=.*(?:backbone\.sta|backbone\.convs|backbone\.norms|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  torch_compile:
    enabled: false
  feature_cache:
    enabled: false
  progressive_resizing:
    enabled: false
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  device: cuda
  output_root: outputs/experiments

inference:
  score_thr: 0.001
  remap_mscoco_category: false
  topk: 300
  detections_per_image: 100

augmentation:
  enabled: true
  fliplr: 0.5
  scale: 0.25
  translate: 0.05
  degrees: 5.0
  shear: 1.0
  perspective: 0.0
  mosaic: 0.3
  close_mosaic: 12
  mixup: 0.0
  hsv_h: 0.015
  hsv_s: 0.25
  hsv_v: 0.20
  brightness: 0.15
  contrast: 0.15
  gamma: 0.0
  blur: 0.0
  noise: 0.0
  min_ellipse_radius: 2.0

output:
  root: outputs/experiments
  experiment_group: dinov3_deimv2
