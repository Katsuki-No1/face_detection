schema_version: 1
experiment_id: active_learning_effect_normal400_vs_active357
purpose: Measure the training-data effect with one fixed production architecture.

comparison_contract:
  base_dataset: face_pose_drive_v2_balanced_811
  additions_split: train
  detector_seed: 0
  query_refinement_seed: 42
  fixed_validation: true
  fixed_test: true
  select_on_test: false
  face_threshold: 0.80
  keypoint_presence_threshold: 0.70

latest_model_contract:
  detector_architecture: DEIMv2-L ellipse with DINOv3 ViT-S/16
  detector_source_config: configs/dinov3_deimv2/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco.yaml
  detector_reference_checkpoint: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/checkpoints/best_val_ellipse_map.pt
  detector_reference_checkpoint_sha256: ffa0ae9fe63df3f7af7ff7b772b80717243dcf544b2c9fcdf944de8899ddd8b7
  query_architecture: DINOv3 Query Refinement with factorized presence/conditional visibility
  query_source_config: keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml
  corrected_query_reference_checkpoint: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square_coco_visibility/query_refinement/checkpoints/best_nme.pt
  corrected_query_reference_checkpoint_sha256: 0bfb912ef395b352a8a41a21f016f1e32c399fbb22dc8247dc90192e38f6b4b2
  state_head_mode: factorized_presence_visibility

