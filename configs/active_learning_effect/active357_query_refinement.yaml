extends: ../../keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml

experiment_name: active_learning_effect_active357_factorized_query_refinement

data:
  dataset_version: face_pose_drive_v2_balanced_811_plus_active357
  root: outputs/dataset_cache/active_learning_effect/active357
  annotations:
    train: outputs/dataset_adapters/active_learning_effect/active357/face_keypoints_train.json
    val: outputs/dataset_adapters/face_pose_drive_v2_balanced_811/face_keypoints_val_keypoint_selection.json
    test: outputs/dataset_adapters/active_learning_effect/active357/face_keypoints_test.json
  expected:
    train:
      images: 4594
      annotations: 7023
      usable_instances: 6513
      sha256: bad8c2eaab2f5a819726b59e43cc13cff67f06392030383b7f72cf40fc44ce3b
    val:
      images: 330
      annotations: 532
      usable_instances: 498
      sha256: 11148e4ec7240b0ec24cc9ade9530fc4fb231f874e23aab6aea7c0c31981a58e
    test:
      images: 528
      annotations: 769
      usable_instances: 720
      sha256: bbab427fdddbfe2d4c0d669ea8d879db58c6f3bab13d6653738b060cecb3e760
  evaluation_sets:
    # The data-effect comparison is evaluated only on the same fixed v2
    # validation and test sets as the normal400 arm. The inherited external
    # set overlaps the candidate pool and is not a valid holdout here.
    external_v1_v2:
      enabled: false

model:
  backbone:
    initialize_from_deim_checkpoint: outputs/experiments/active_learning_effect/active357/ellipse_deimv2_l/checkpoints/best_val_ellipse_map.pt

detector:
  name: active_learning_effect_active357_ellipse_deimv2_l
  config: configs/active_learning_effect/active357_detector.yaml
  checkpoint: outputs/experiments/active_learning_effect/active357/ellipse_deimv2_l/checkpoints/best_val_ellipse_map.pt
  score_threshold: 0.80

train:
  seed: 42
  refinement_initialize_from_query: false

evaluation:
  default_sets: [v2_val, v2_test]
  defer_until_all_checkpoints: false
  architecture_id: active_learning_effect_active357_deimv2_l_query_refinement
  baseline_aligned_output_root: outputs/experiments/active_learning_effect/active357/evaluation

outputs:
  root: outputs/experiments/active_learning_effect/active357

wandb:
  group: active_learning_effect_normal400_vs_active357
