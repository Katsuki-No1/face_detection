schema_version: 1
project_root: ../..

# Engine plans are built for the exact GPU after the training job releases it.
# FP16 applies to TensorRT internal kernels; model I/O remains float32.
precision: fp16
workspace_mib: 4096
hardware_compatibility: exact_gpu

engines:
  detector:
    onnx: outputs/active_learning_tensorrt/deimv2_l_query_refinement/onnx/deimv2_l_ellipse.onnx
    mixed_precision_onnx: outputs/active_learning_tensorrt/deimv2_l_query_refinement/onnx/deimv2_l_ellipse_fp16.onnx
    engine: outputs/active_learning_tensorrt/deimv2_l_query_refinement/engines/deimv2_l_ellipse_fp16.engine
    inputs:
      images:
        min: [1, 3, 960, 960]
        opt: [2, 3, 960, 960]
        max: [4, 3, 960, 960]

  query:
    onnx: outputs/active_learning_tensorrt/deimv2_l_query_refinement/onnx/query_refinement.onnx
    mixed_precision_onnx: outputs/active_learning_tensorrt/deimv2_l_query_refinement/onnx/query_refinement_fp16.onnx
    engine: outputs/active_learning_tensorrt/deimv2_l_query_refinement/engines/query_refinement_fp16.engine
    inputs:
      crops:
        min: [1, 3, 256, 256]
        opt: [16, 3, 256, 256]
        max: [32, 3, 256, 256]
