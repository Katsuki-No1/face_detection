project_root: ..
model_registry: configs/model_registry/active_learning_face_models.yaml

input_root: data/input/active_learning
output_root: data/output/active_learning
video_include_globs:
  - MFYD*

frames_per_video: 100
sample_fps: 0.5
jpeg_quality: 95
context_half_window_sec: 2.0
# Dense failure events are usually shorter than the legacy 30-second gap.
# Ten seconds preserves one representative per event while allowing all six
# requested quotas to be filled for this source video.
min_interval_sec: 10.0
random_seed: 20260722

selection_bucket_ratios:
  model_disagreement: 0.35
  temporal_anomaly: 0.25
  bbox_instability: 0.15
  low_confidence: 0.10
  head_evidence: 0.10
  dino_novelty: 0.05

models:
  - ref: yolo26m_pose_face_pose_drive_v1_960
    device: cuda:0
  - ref: dinov3_deimv2_l_face_pose_drive_v1_960_full
    device: cuda:0

head_model:
  ref: rtmdet_hf_head_face_pose_drive_v1_960_epoch54
  device: cuda:0

confidence_boundary:
  min_ratio: 0.70
  max_ratio: 1.30

bbox_matching:
  iou_threshold: 0.30
  center_distance_threshold: 0.25
  min_area_ratio: 0.33
  max_area_ratio: 3.0

dense_analysis:
  enabled: true
  fps: 5.0
  half_window_sec: 5.0
  proposal_multiplier: 5
  min_track_hits: 3
  max_track_gap_sec: 1.0

novelty:
  enabled: true
  reference_annotation: datasets/face_pose_drive_v1/train.json
  reference_image_root: datasets/face_pose_drive_v1
  head_reference_annotation: datasets/rtmdet_hf_drive_v1/train.json
  head_reference_image_root: datasets/rtmdet_hf_drive_v1
  reference_sample_count: 256
  cluster_count: 24
  roi_padding: 0.25
  roi_min_side: 16
  roi_input_size: 384

clip_window:
  mode: adaptive_track
  min_duration_sec: 4.0
  max_duration_sec: 10.0
  context_padding_sec: 1.0

temporal_window_sec: 4.0
scene_change_threshold: 0.32
dark_brightness_threshold: 8.0
broken_contrast_threshold: 1.0
recursive: false

split_annotations:
  train: datasets/face_pose_drive_v1/train.json
  val: datasets/face_pose_drive_v1/val.json
  test: datasets/face_pose_drive_v1/test.json

montage:
  width: 1920
  height: 1080
  fps: 30.0
  review_inference_fps: 2.0
  codec: libx264
  crf: 20
  preset: medium
