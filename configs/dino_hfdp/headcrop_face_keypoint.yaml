experiment:
  family: dino_hfdp
  name: dino_hfdp_headcrop_face_keypoint
  description: DINOv3 ViT-B/16 frozen backbone with SCRFD-style face bbox and five-keypoint detector on head crops.

model:
  type: dino_scrfd
  backbone:
    name: dinov3_vitb16
    patch_size: 16
    embed_dim: 768
    hub_repo: /home/katsuki/.cache/torch/hub/facebookresearch_dinov3_main
    hub_model: dinov3_vitb16
    hub_module: dinov3.hub.backbones
    weights: /home/katsuki/projects/face_detection/script/script_model/DINO/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    pretrained: false
    freeze: true
    unfreeze_last_n_blocks: 0
    strict_weights: true
    num_prefix_tokens: 0
    token_key: x_norm_patchtokens
    call_method: forward_features
    allow_non_divisible: false
  adapter:
    type: simple_fpn
    out_channels: 256
    norm: gn
    activation: silu
  neck:
    out_channels: 256
    num_levels: 3
    norm: gn
    activation: silu
  head:
    num_classes: 1
    num_keypoints: 5
    head_channels: 256
    num_convs: 2

loss:
  cls_weight: 1.0
  center_offset_weight: 1.0
  bbox_weight: 2.0
  kpt_weight: 1.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  center_sampling_radius: 0

postprocess:
  score_threshold: 0.05
  nms_threshold: 0.4
  topk: 1000
  detections_per_image: 300

data:
  format: coco
  data_root: null
  annotation_path: outsput/experience/dino_hfdp/data/dino_headcrop_face_keypoint/train.json
  image_root: outsput/experience/data/mmdet_headcrop_face
  metadata_path: null
  split: train
  image_size: 896
  include_negative: true
  synthetic_if_missing: false

train:
  imgsz: 896
  batch_size: 4
  lr_head: 1.0e-4
  lr_backbone: 0.0
  epochs: 100
  seed: 42
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 3
  weight_decay: 0.05
  max_grad_norm: 10.0
  amp: true
  tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  fused_optimizer: true
  torch_compile:
    enabled: false
    mode: reduce-overhead
    fullgraph: false
    dynamic: false
  feature_cache:
    enabled: true
    dtype: float16
    reuse_existing: true
  progressive_resizing:
    enabled: false
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  device: cuda
  output_root: outsput/experience/dino_hfdp/runs

augmentation:
  enabled: false
