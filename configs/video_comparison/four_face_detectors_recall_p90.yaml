project_root: ../..

# Every operating threshold was selected on validation only by maximizing
# recall subject to precision > 0.90 at IoU 0.50.
models:
  - name: YOLO26m Pose
    type: yolo26m
    weights: runs/yolo/yolo26_pose/face_pose_drive_v1/yolo26m_pose_full/weights/best.pt
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.13
    batch_size: 8
    max_detections: 100
    source_class_id: 0
    class_id: 2
    class_name: face

  - name: DEIMv2-L DINOv3 unfreeze
    type: dinov3_deimv2
    config: configs/dinov3_deimv2/dinov3_deimv2_l_vits16_face_pose_drive_v1_960_full.yaml
    weights: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v1_960_full/checkpoints/best_val_map.pt
    checkpoint_state: auto
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.33
    batch_size: 4
    max_detections: 100
    source_class_id: 0
    class_id: 2
    class_name: face

  - name: RTMDet-S-HF (Face)
    type: rtmdet
    config: configs/rtmdet/rtmdet_s_hf_full_960_wandb.py
    weights: outputs/experiments/rtmdet_s_hf_drive_v1_960_low_lr_20260719/best_coco_bbox_mAP_epoch_54.pth
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.36
    batch_size: 8
    max_detections: 100
    source_class_id: 1
    class_id: 2
    class_name: face

  - name: YOLO11s Pose
    type: yolo11s
    weights: runs/yolo11s_pose_face_pose_drive_v1_960_20260714/weights/best.pt
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.27
    batch_size: 8
    max_detections: 100
    source_class_id: 0
    class_id: 2
    class_name: face

render:
  width: 2560
  height: 1440
  codec: libx264
  crf: 20
  preset: fast
  audio_codec: aac
  audio_bitrate: 192k
