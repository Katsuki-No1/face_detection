schema_version: 1
project_root: ../..
seed: 0

input:
  # Use the confirmed 10-minute source montage, not the already-rendered
  # four_model_comparison video stored beside it.
  requested_path: data/output/active_learning/active_montage
  path: data/output/active_learning/active_montage/MID_2026-07-22/MIDA-700_uniform_10m.mp4
  recursive: false
  extensions: [.mp4, .mov, .mkv, .avi, .webm]

output:
  root: outputs/video_comparison/deim_architecture_four_panel/active_montage_mida700_uniform_10m

# The ellipse detector is intentionally evaluated once per frame. Its JSONL
# result is then reused byte-for-byte as the crop source of Query Refinement
# and ORFormer, so panels 2-4 differ in landmark processing rather than in
# detector candidates.
models:
  normal_deim:
    title: DEIMv2-L
    # Use the immutable config captured with this checkpoint, not the mutable
    # training entry point that now targets the balanced-811 continuation.
    config: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_960_full/config_resolved.yaml
    checkpoint: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_960_full/checkpoints/best_val_map.pt
    input_size: 960
    score_threshold: 0.30
    maximum_detections: 100
    # Probe real source frames once, retain 15% VRAM headroom, and use the
    # fastest candidate that completed without OOM. The largest safe candidate
    # is also recorded in the per-video batch_tuning artifact.
    inference_batch_size: auto
    batch_candidates: [1, 2, 4, 8, 16, 32]
    auto_batch_selection: throughput
    gpu_memory_headroom_ratio: 0.15
    auto_batch_warmup_iterations: 1
    auto_batch_benchmark_iterations: 2
    threshold_selection_split: val
    threshold_source: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_960_full/config_resolved.yaml

  ellipse_deim:
    title: DEIMv2-L ellipse
    config: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/config_resolved.yaml
    checkpoint: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/checkpoints/best_val_ellipse_map.pt
    input_size: 960
    score_threshold: 0.33
    maximum_detections: 100
    inference_batch_size: auto
    batch_candidates: [1, 2, 4, 8, 16, 32]
    auto_batch_selection: throughput
    gpu_memory_headroom_ratio: 0.15
    auto_batch_warmup_iterations: 1
    auto_batch_benchmark_iterations: 2
    threshold_selection_split: val
    threshold_source: keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml

  query_refinement:
    title: DEIMv2-L + query refinement
    config: keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml
    checkpoint: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/query_refinement/checkpoints/best_nme.pt
    input_size: 256
    batch_size: 32
    crop_scale: 1.25
    flip_test: false
    visibility_threshold: 0.50
    detector_source: ellipse_deim
    checkpoint_selection_split: val
    checkpoint_selection_metric: nme

  orformer:
    title: DEIMv2-L + ORFormer
    config: keypoint_comparison2/configs/production.yaml
    checkpoint: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/dinov3_orformer_rtmcc/checkpoints/best_nme.pt
    model_name: dinov3_orformer_rtmcc
    input_size: 320
    batch_size: 32
    crop_scale: 1.25
    flip_test: true
    visibility_threshold: 0.50
    detector_source: ellipse_deim
    checkpoint_selection_split: val
    checkpoint_selection_metric: nme

render:
  width: 2560
  height: 1440
  codec: libx264
  crf: 20
  preset: fast
  audio_codec: aac
  audio_bitrate: 192k
  landmark_radius: 5
  line_width: 3
