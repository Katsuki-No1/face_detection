active_model: deimv2_l_query_refinement_tensorrt_fp16

models:
  deimv2_l_query_refinement_tensorrt_fp16:
    adapter_class: src.active_learning.tensorrt_backend:TensorRTDeimv2QueryRefinementAdapter
    capabilities: [face, ellipse, keypoints]
    assets:
      detector_engine: outputs/active_learning_tensorrt/deimv2_l_query_refinement/engines/deimv2_l_ellipse_fp16.engine
      query_engine: outputs/active_learning_tensorrt/deimv2_l_query_refinement/engines/query_refinement_fp16.engine
      export_manifest: outputs/active_learning_tensorrt/deimv2_l_query_refinement/onnx/export_manifest.json
      tensorrt_profile: configs/tensorrt/active_learning_deimv2_l_query_refinement_fp16.yaml
      threshold_selection_config: keypoint_comparison1/configs/dinov3_vits16_face_pose_drive_v2.yaml
    options:
      detector_input_size: 960
      detector_batch_size: 2
      detector_num_classes: 1
      detector_topk: 300
      maximum_detections: 100
      pipeline_parallel: true
      pipeline_stage_size: 4
      query_input_size: 256
      query_batch_size: 32
      query_mean: [0.485, 0.456, 0.406]
      query_std: [0.229, 0.224, 0.225]
      crop_scale: 1.25
    thresholds:
      inference_confidence_floor: 0.05
      face_confidence: 0.33
      keypoint_confidence: 0.50
      selection_split: val
      face_selection_rule: maximum recall while precision >= 0.90 at IoU 0.50
      keypoint_score_contract: legacy COCO v>0 point-existence probability
