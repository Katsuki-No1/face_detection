    - {name: medium, overlap: [0.10, 0.20], probability: 0.40}
    - {name: strong, overlap: [0.20, 0.40], probability: 0.40}
  interval_convention: light_both_exclusive_medium_strong_lower_exclusive_upper_inclusive
  maximum_placement_attempts: 128
  minimum_donor_face_overlap: 0.01  # medium/strong; light requires positive overlap only
  profile_donor_probability: 0.50
