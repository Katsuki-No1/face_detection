schema_version: messenger-geometry-prior-plan-v1
architecture: messenger_geometry_prior_v1
status: nine_productions_and_common_evaluations_complete_full_reports_pending
enabled: true
runnable: true
design: docs/messenger_geometry_prior_design.md
implementation: keypoint_comparison1/landmark_detection/geometry_prior_recovery.py
preparation: scripts/prepare_messenger_geometry_priors.py
authorization: User requested scheduling the implemented adversarial model family on 2026-10-11; production requires
  integration and four fresh authenticated gates.
deployment:
  type: ordered_cascade
  stages:
  - full_image_face_ellipse
  - face_crop_dino
  - messenger_recovery_with_geometry_prior_fusion
  - query_refinement
  external_head: false
  auxiliary_inference_branch: frozen_crop_dino_for_prior_observation
  discriminator: training_only
comparison:
  first: existing_messenger_matched_control_vs_k1_to_k7_no_adversarial
  second: validation_selected_prior_without_vs_with_adversarial
  k_candidates:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  baseline_role: local_existing_messenger_matched_control_not_global_reference
  same_init_data_augmentation_budget_task_loss: true
  test_selection: prohibited
prior:
  source: audited_clean_train_predicted_ellipse_roi_features
  fitting: deterministic_kmeans_pp_on_channel_standardized_spatial_features
  seed: 42
  max_iterations: 100
  kmeans_feature_normalization: l2_flattened_map
  routing: nearest_standardized_geometry_cluster_mean
  geometry:
  - log_relative_major_diameter
  - log_major_minor_ratio
  - eccentricity_sin_2theta
  - eccentricity_cos_2theta
  geometry_temperature_diagnostic: 1.0
  major_diameter_scale_denominator: sqrt_source_image_width_times_height
  theta: clockwise_image_x_axis_radians_modulo_pi_after_augmentation
  observation_backbone: frozen_authenticated_copy_of_initial_student_backbone
  calibration: disjoint_source_video_subset_of_train
  score: channel_pearson_correlation_divided_by_one_plus_standardized_mean_l1
  threshold: cluster_and_position_lower_quantile
  initial_lower_quantile: 0.05
  channel_scale_floor: 0.05
  geometry_scale_floor: 0.1
  values_status: provisional_implementation_defaults_not_validation_selected
  missing_keypoints: not_automatically_clean_or_occluded
mask:
  support: predicted_face_ellipse_in_crop_feature_grid
  connectivity: 4
  initial_minimum_component_fraction: 0.05
  denominator: ellipse_support_cells
  face_decision: at_least_one_component_at_or_above_fraction
  local_fusion: retains_smaller_anomalous_regions_even_without_face_flag
  differentiable: false
fusion:
  formula: Y = X + mask * messenger_adoption_gate * sigmoid(channel_parameter) * (R - X)
  channel_parameter_initial: 0.0
  visible_identity: exact
  warmup: preserve_parent_mixing_enabled_switch
loss:
  task: caller_existing_LandmarkLoss
  paired_reconstruction_initial_weight: 0.1
  paired_teacher: same_target_same_geometry_clean_crop_fixed_observer
  adversarial_initial_weight: 0.01
  adversarial_initially_enabled: false
  discriminator: spatial_conditional_on_visible_context_geometry_and_mask
  generator_objective: task_plus_paired_candidate_and_fused_smooth_l1_plus_optional_non_saturating_gan
  discriminator_objective: logistic_real_fake_on_predicted_mask
  keypoint_gradient_targets:
  - student_backbone
  - messenger_generator
  - fusion
  - keypoint_head
  discriminator_keypoint_gradient: false
  optimizers: separate_generator_and_discriminator
future_production_requirements:
  gates:
  - schema
  - gpu_step
  - overfit
  - small_scale
  microbatch_candidates:
  - 4
  - 8
  - 16
  effective_batch: 64
  seed: 42
  runtime_oom_fallback: required
  wandb: required
  max_epochs: 40
  warmup_epochs: 5
  flat_epochs: 5
  validation_every_epoch: true
  selection: conditional_semantic_macro_f1_nme_0.10
  presence_threshold: 0.7
  minimum_epoch: 10
  patience: 5
  min_delta: 0.0001
  checkpoints: last_and_best_only_after_success
  common_evaluation: validation_then_validation_locked_test_with_required_tables_and_failure_review
schedule:
  integration_after_production: continuous_recovery_abc_b_real_face_w48_s2_production_train
  user_order_20261012: Complete real-face Messenger training first, then production/WandB integration, isolated4/8/16
    preflight, per-arm four gates/queue, common evaluation and validation-only k selection before adversarial.
  plan_id: messenger_geometry_prior_adversarial_20261011
