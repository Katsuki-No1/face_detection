project_root: ..
input_dir: data/input/active_learning/active_learning(dataset=3000frame)7-17
output_dir: data/output/active_learning/active_learning_round_001_v2

models:
  - name: yolo11s
    type: yolo11s
    weights: runs/yolo11s_face_pose_drive_v1_960_20260714/weights/best.pt
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.05
    analysis_threshold: 0.52
    max_detections: 100
    batch_size: 8
    model_weight: 0.4789
    validation_map: 0.4789
    class_id: 2
    class_name: face
  - name: rtmdet
    type: rtmdet
    config: configs/rtmdet/rtmdet_s_face_pose_drive_v1_960.py
    weights: outputs/experiments/rtmdet_s_face_pose_drive_v1_960_low_lr_20260717/best_coco_bbox_mAP_epoch_35.pth
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.05
    analysis_threshold: 0.40
    max_detections: 100
    batch_size: 8
    model_weight: 0.5366
    validation_map: 0.5366
    class_id: 2
    class_name: face
  - name: dino_deimv2
    type: dinov3_deimv2
    config: configs/dinov3_deimv2/dinov3_deimv2_m_face_pose_drive_v1_960_aug_unfreeze.yaml
    weights: outputs/experiments/dinov3_deimv2_m_face_pose_drive_v1_960_aug_unfreeze_20260714/checkpoints/epoch_0010.pt
    device: cuda:0
    input_size: 960
    confidence_threshold: 0.05
    analysis_threshold: 0.51
    max_detections: 100
    batch_size: 8
    model_weight: 0.4760
    validation_map: 0.4760
    class_id: 2
    class_name: face

# The current two-class RTMDet-HF checkpoint is the fallback. If the adoption
# manifest exists, its selected config/checkpoint overrides these paths.
head_model:
  name: head_rtmdet_aux
  type: rtmdet
  config: outsput/experience/configs/mmdet/rtmdet_hf_full.py
  weights: outsput/experience/work_dirs/mmdet/rtmdet_hf_full_rtm_hfdp_20260704_170447/best_coco_bbox_mAP_50_epoch_67.pth
  device: cuda:0
  input_size: 960
  confidence_threshold: 0.05
  analysis_threshold: 0.25
  max_detections: 100
  batch_size: 8
  class_id: 1
  class_name: head
head_adoption_manifest: outputs/experiments/rtmdet_s_head_mmdet_hf_960/adoption.json

sample_fps: 0.5
clip_duration_sec: 10
target_clip_count: 40
allow_target_shortfall: true
max_clips_per_video: 8
min_clips_per_video: 2
min_interval_sec: 30
max_clips_per_scene: 2
max_clips_per_track: 2
random_seed: 20260717

selection_bucket_ratios:
  model_disagreement: 0.35
  temporal_anomaly: 0.30
  no_detection_evidence: 0.20
  roi_novelty: 0.10
  low_presence_audit: 0.05

bbox_matching:
  iou_threshold: 0.30
  center_distance_threshold: 0.25
  min_area_ratio: 0.33
  max_area_ratio: 3.0

dense_analysis:
  enabled: true
  fps: 5
  half_window_sec: 5
  proposal_multiplier: 5
  min_track_hits: 3
  max_track_gap_sec: 1

presence_classifier:
  enabled: true
  checkpoint: outputs/models/roi_presence_dinov3_v1/best.pt
  metadata: outputs/models/roi_presence_dinov3_v1/metadata.json
  face_threshold: 0.50
  head_threshold: 0.50
  roi_input_size: 384

clip_window:
  mode: adaptive_track
  min_duration_sec: 4
  max_duration_sec: 10
  context_padding_sec: 1

temporal_window_sec: 4
scene_change_threshold: 0.32
duplicate_phash_distance: 5
dark_brightness_threshold: 8.0
broken_contrast_threshold: 1.0

novelty:
  enabled: true
  reference_annotation: datasets/face_pose_drive_v1/train.json
  reference_image_root: datasets/face_pose_drive_v1
  head_reference_annotation: outsput/experience/data/mmdet_hf/train.json
  head_reference_image_root: outsput/experience/data/mmdet_hf
  reference_sample_count: 256
  cluster_count: 24
  roi_padding: 0.25
  roi_min_side: 16

split_annotations:
  train: datasets/face_pose_drive_v1/train.json
  val: datasets/face_pose_drive_v1/val.json
  test: datasets/face_pose_drive_v1/test.json

montage:
  width: 3840
  height: 2160
  fps: 30
  review_inference_fps: 2.0
  codec: libx264
  crf: 20
  preset: medium
