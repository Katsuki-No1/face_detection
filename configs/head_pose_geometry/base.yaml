extends: ../face_keypoint_cooperative/face_keypoint_cooperative_detr_l_960.yaml

schema_version: 1
experiment_name: head_pose_geometry_base

model:
  head_pose_geometry:
    enabled: true
    inject_pose_queries: true
    query_injection_temperature: 0.20
    use_valid_pixel_and_border_inputs: true
    augmentation_consistency_enabled: true
    pose_encoder:
      checkpoint: checkpoint/head_pose_geometry/sixdrepnet360_1x3x224x224_full.onnx
      training_mode: frozen
      embedding_dimension: 128
      allow_full_finetune: false
    crop:
      output_size: 224
      context_scale: 1.35
      pad_value: 0.0
      augmentation:
        center_translation: 0.08
        log_scale_error: 0.12
        asymmetric_context: 0.12
        log_aspect_error: 0.08
        boundary_truncation_probability: 0.20
        boundary_truncation_fraction: [0.05, 0.35]
    geometry:
      enabled: false
      hidden_dimension: 128
      contour_points: 48
      shape_dimension: 0
      shape_limit: 0.15
      minimum_scale: 0.0001
      maximum_scale: 1.5
      visibility_sharpness: 10.0
    fusion:
      enabled: false
      hidden_dimension: 128
    loss_weights:
      rotation: 1.0
      projected_keypoints: 5.0
      amodal_ellipse_center: 2.0
      amodal_ellipse_axes: 2.0
      amodal_ellipse_angle: 1.0
      head_relative: 1.0
      observability: 1.0
      visibility: 0.5
      scale_prior: 0.05
      shape_prior: 0.01
      uncertainty: 0.05
      template_3d: 1.0
      scale_translation: 1.0
      augmentation_consistency: 0.5

data:
  head_centric: true
  image_root: outputs/dataset_cache/face_pose_drive_v2_balanced_811
  category_ids: [1]
  target_category_id: 2
  annotations:
    train: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/train.json
    val: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/val.json
    test: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/test.json
  # These caches must contain external detector predictions in schema v1.
  # Validation/test intentionally fail instead of falling back to GT HEADs.
  predicted_head_caches:
    val: outputs/head_pose_geometry/head_detections/val.json
    test: outputs/head_pose_geometry/head_detections/test.json
  synthetic:
    # No licensed synthetic export is present in this repository. Set these
    # paths and enable explicitly for Stage 3+ full-range retention batches.
    enabled: false
    annotation: null
    image_root: null
    fraction: 0.25

train:
  learning_rates:
    head_pose_geometry: 0.0001

output:
  root: outputs/experiments/head_pose_geometry
