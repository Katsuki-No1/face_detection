schema_version: 1
experiment_name: dinov3_vits16_face_landmarks_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square_factorized_state

# A/B/C/D/E/F/G are evaluation conditions, not seven separately trained models.
# A/C share vitpose, B/D share query, and E uses query_refinement initialized
# from query. F/G share parameter-matched vitpose_376. All four heads use the
# same DINOv3 initialization and crop recipe.
data:
  dataset_version: face_pose_drive_v2_balanced_811
  # COCO v=0: missing, v=1: labeled but occluded, v=2: visible.
  # Presence is supervised on every slot. Conditional visibility and
  # coordinates are supervised only on present (v>0) slots.
  keypoint_target_policy:
    coordinate_mask: coco_v_gt_0
    presence_target: coco_v_gt_0
    presence_loss_mask: all_keypoint_slots
    visibility_target: coco_v_gt_1
    visibility_loss_mask: coco_v_gt_0
  include_missing_keypoint_instances: true
  root: outputs/dataset_cache/face_pose_current
  annotations:
    train: outputs/dataset_adapters/face_pose_drive_v2_balanced_811/face_keypoints_train.json
    val: outputs/dataset_adapters/face_pose_drive_v2_balanced_811/face_keypoints_val_keypoint_selection.json
    test: outputs/dataset_adapters/face_pose_drive_v2_balanced_811/face_keypoints_test.json
  ellipse_error_model: outputs/crop_error_models/face_pose_drive_v2_balanced_811/ellipse_deim_val_residuals.json
  expected:
    train:
      images: 4237
      annotations: 6529
      usable_instances: 6081
      sha256: 2fac1a20b089c801099bed0b439db3ed612d2ea812b5eab21a574f473f981cfa
    val:
      images: 330
      annotations: 532
      usable_instances: 498
      sha256: 11148e4ec7240b0ec24cc9ade9530fc4fb231f874e23aab6aea7c0c31981a58e
    test:
      images: 528
      annotations: 769
      usable_instances: 720
      sha256: bbab427fdddbfe2d4c0d669ea8d879db58c6f3bab13d6653738b060cecb3e760
  category_ids: [2]
  input_size: 256
  # The source DEIMv2-L normalizes [0,1] RGB with these values before DINOv3.
  # Applying them in the crop dataset preserves the trained backbone input domain.
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    # A jointly sampled, area-stratified DEIM residual is applied to the GT
    # ellipse on every training sample. Validation uses fixed GT. The source
    # ROI is a theta-aligned square based on the perturbed long
    # axis. One isotropic affine preserves facial aspect ratio; the extra
    # short-axis area is real deployment background rather than padding.
    roi_geometry: long_axis_square
    scale_factor: 1.25
    # Legacy fallback bounds for isolated tests only; production requires the
    # calibrated ellipse_error_model above.
    scale_jitter: 0.20
    center_jitter: 0.08
    rotation_deg: 25.0
    horizontal_flip_probability: 0.50
    brightness: 0.20
    contrast: 0.20
    saturation: 0.15
    blur_probability: 0.10
    blur_kernel_max: 5
    occlusion_probability: 0.10
    occlusion_area: [0.02, 0.12]
  leakage_audit:
    enabled: true
    splits: [train, val, test]
    fail_on_external_overlap: true
  evaluation_sets:
    # Full 530-image validation set used only to lock/report the common
    # baseline-aligned operating point.  This is separate from the 330-image
    # keypoint-selection subset used during training.
    v2_val:
      root: outputs/dataset_cache/face_pose_current
      annotation: outputs/dataset_adapters/face_pose_drive_v2_balanced_811/face_keypoints_val.json
      category_ids: [2]
      sha256: 906fd215ed30d056cc9dfe7666143c796e50f6810aa5b5a50cbffe28bf04a2ab
    v2_test:
      root: outputs/dataset_cache/face_pose_current
      annotation: outputs/dataset_adapters/face_pose_drive_v2_balanced_811/face_keypoints_test.json
      category_ids: [2]
      sha256: bbab427fdddbfe2d4c0d669ea8d879db58c6f3bab13d6653738b060cecb3e760
    external_v1_v2:
      enabled: false
      disabled_reason: legacy_external_evaluation_dataset_not_available
      root: datasets/testdata_for_v1-2
      annotation: datasets/testdata_for_v1-2/annotations/deim_dino/face_keypoints_test.json
      category_ids: [2]
      sha256: f9c3fe76cc948b43d31cf79c58a514cb3432855c2f666c58d39936f7346f1690
      must_be_disjoint_from_training: true

model:
  num_landmarks: 5
  landmark_names: [left_eye, right_eye, nose_tip, left_mouth_corner, right_mouth_corner]
  # Every head predicts P(present) and P(visible | present) independently;
  # Query Refinement also updates both logits at every refinement stage.
  # Omitting this key restores the exact legacy one-logit checkpoint contract.
  state_head_mode: factorized_presence_visibility
  backbone:
    name: dinov3_vits16
    patch_size: 16
    embed_dim: 384
    hub_repo: models/source/dinov3
    hub_model: dinov3_vits16
    hub_module: dinov3.hub.backbones
    pretrained: false
    weights: null
    freeze: false
    num_prefix_tokens: 0
    token_key: x_norm_patchtokens
    call_method: forward_features
    allow_non_divisible: false
    initialize_from_deim_checkpoint: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/checkpoints/best_val_ellipse_map.pt
    strict_detector_initialization: true
  variants:
    vitpose:
      hidden_channels: 256
      deconv_layers: 2
      deconv_kernel: 4
      softargmax_temperature: 0.10
    # 376 channels make this heatmap head almost exactly parameter-matched to
    # the factorized four-layer Query head: 4,579,399 vs 4,579,338 parameters.
    vitpose_376:
      hidden_channels: 376
      deconv_layers: 2
      deconv_kernel: 4
      softargmax_temperature: 0.10
    query:
      dimension: 256
      decoder_layers: 4
      heads: 8
      feedforward: 1024
      dropout: 0.0
      auxiliary_supervision: true
    query_refinement:
      dimension: 256
      decoder_layers: 4
      heads: 8
      feedforward: 1024
      dropout: 0.0
      auxiliary_supervision: true
      stages:
        - {radius_in_feature_cells: 2.0, maximum_delta: 0.08, samples_per_axis: 3}
        - {radius_in_feature_cells: 1.0, maximum_delta: 0.04, samples_per_axis: 3}

detector:
  name: deimv2_l_dinov3_vits16_balanced_811_ellipse_from_coco
  config: configs/dinov3_deimv2/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco.yaml
  checkpoint: outputs/experiments/dinov3_deimv2_l_vits16_face_pose_drive_v2_balanced_811_960_ellipse_from_coco/checkpoints/best_val_ellipse_map.pt
  crop_geometry: ellipse
  image_size: 960
  # Selected only on v2 validation: maximum recall while precision >= 0.90
  # (P=0.9026, R=0.8750 at IoU 0.50). It is fixed for both test sets.
  score_threshold: 0.33
  maximum_detections: 100
  matching_iou_threshold: 0.50

loss:
  heatmap_weight: 1.0
  coordinate_weight: 2.0
  presence_weight: 0.10
  visibility_weight: 0.10
  # Explicit knobs keep class balancing independently tunable from the
  # architecture. Initial production training uses neutral BCE weights.
  presence_positive_weight: 1.0
  presence_missing_weight: 1.0
  visibility_visible_weight: 1.0
  visibility_occluded_weight: 1.0
  auxiliary_weight: 0.50
  refinement_auxiliary_weight: 0.75
  heatmap_sigma: 1.5
  wing_width: 0.10
  wing_curvature: 0.02

train:
  production_mode: true
  minimum_epochs: 100
  epochs: 150
  batch_size: 32
  gradient_accumulation_steps: 2
  fraction: 1.0
  seed: 42
  lr_backbone: 1.25e-5
  lr_head: 5.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 5
  minimum_lr_ratio: 0.01
  freeze_backbone_epochs: 5
  max_grad_norm: 1.0
  amp: true
  tf32: true
  fused_optimizer: true
  num_workers: 8
  prefetch_factor: 4
  checkpoint_every: 5
  # Keep the A-G architecture ablation on the same 150-epoch budget. Enabling
  # warm-start would give E all of B's training plus another complete run and
  # confound the measured refinement gain.
  refinement_initialize_from_query: false
  ema:
    enabled: true
    decay: 0.9998
  early_stopping:
    enabled: true
    minimum_epoch: 100
    patience: 25
    min_delta: 0.0001

evaluation:
  pipeline_contract:
    type: cascade
    stages: [full_image_face_ellipse, face_crop_keypoint]
  default_sets: [v2_test]
  # The live primary queue predates the appended Query job and its loaded
  # evaluation command still requests all heads. That call exits cleanly when
  # a checkpoint is missing; the successor runs Query-vs-ViTPose-376 directly.
  defer_until_all_checkpoints: true
  batch_size: 64
  num_workers: 8
  attention_batches: 4
  interference_batch_size: 8
  interference_maximum_parameters: 2000000
  save_predictions: true

outputs:
  # Keep the already-running queue's resolved marker root. The embedded
  # experiment_name, state_head_mode, and checkpoint contract distinguish
  # this factorized run from any legacy one-logit checkpoint.
  root: outputs/landmark_detection/dinov3_vits16_face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square_coco_visibility

wandb:
  enabled: true
  entity: sato-waseda-university
  project: face_detection
  group: face_pose_drive_v2_balanced_811_ellipse_long_axis_square_landmark_heads_factorized_state
  mode: online
