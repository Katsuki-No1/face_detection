extends: production.yaml

experiment_name: face_keypoint_comparison2_deimv2_joint_ellipse_local_refinement_seed42

data:
  joint:
    # Head boxes are used only by the conditional validation-selection metric.
    head_annotations:
      train: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/train.json
      val: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/val.json
      test: outputs/dataset_cache/face_pose_drive_v2_balanced_811/annotations/face_dino_v1/test.json

models:
  deimv2_joint:
    # The Face query is supervised and published as
    # (cx, cy, semi-major, semi-minor, angle), not as a bbox.
    face_output_geometry: ellipse
    state_head_mode: factorized_presence_visibility
    presence_loss_weight: 1.0
    batch_size: 8
    gradient_accumulation_steps: 2
    ellipse_local_refinement:
      enabled: true
      roi_size: 16
      roi_scale: 1.25
      layers: 2
      heads: 8
      feedforward: 896
      dropout: 0.0
      maximum_base_delta: 0.10
      minimum_radius: 0.001
      detach_ellipse: true
      stages:
        - radius_in_feature_cells: 2.0
          maximum_delta: 0.08
          samples_per_axis: 3
        - radius_in_feature_cells: 1.0
          maximum_delta: 0.04
          samples_per_axis: 3

train:
  minimum_epochs: 10
  epochs: 40
  warmup_epochs: 2
  freeze_backbone_epochs: 2
  checkpoint_every: 5
  early_stopping:
    enabled: true
    minimum_epoch: 10
    patience: 5
    min_delta: 0.0001
  checkpoint_selection:
    topdown_metric: nme
    joint_metric: conditional_semantic_macro_f1_nme_0.10
    joint_direction: maximize
    face_score_threshold: 0.33
    face_matching_iou: 0.50
    face_threshold_source: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_gt_ellipse_long_axis_square/deimv2_joint/evaluation/val/baseline_aligned/face_threshold_selection.json
    point_presence_threshold: 0.70
    nme_threshold: 0.10
    head_normalization_scale: 1.20
  wandb:
    enabled: true
    metric_schema_version: 3
    live_sync_seconds: 30
    entity: sato-waseda-university
    project: face_detection
    group: keypoint_comparison2-ellipse-local-refinement
    name: deimv2_joint_ellipse_local_refinement_seed42
    mode: online
    tags:
      - DEIMv2-L
      - joint-face-keypoint
      - ellipse-conditioned-roi
      - STA-c1-F4
      - local-refinement-x2
      - face_pose_drive_v2_balanced_811

evaluation:
  point_presence_threshold: 0.70

output:
  root: outputs/keypoint_comparison2/face_pose_drive_v2_balanced_811_ellipse_local_refinement_seed42
